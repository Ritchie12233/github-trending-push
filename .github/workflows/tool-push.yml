name: 每日工具卡

on:
  schedule:
    # 周一至周五 UTC 9:27 = KL 5:27 PM
    - cron: "27 9 * * 1-5"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "测试模式"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 执行推送
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python tool.py --test
          else
            python tool.py
          fi

      - name: 提交归档
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add library/
          git diff --staged --quiet || git commit -m "archive: $(TZ='Asia/Kuala_Lumpur' date +%Y-%m-%d) 工具卡归档"
          git push
